name: Update boosted creatures

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch:      # allow manual run

jobs:
  update-boosted:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate boosted.json
        run: node scripts/generate-boosted.js

      - name: Commit changes
        run: |
          if git status --porcelain | grep boosted.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add boosted.json
            git commit -m "Update boosted.json"
            git push
          else
            echo "No changes in boosted.json"
          fi
