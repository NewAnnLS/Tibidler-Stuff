<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tibidler Items Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #050814;
      --bg-alt: #0b1020;
      --card: #111827;
      --accent: #38bdf8;
      --accent-soft: rgba(56,189,248,0.15);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2933;
      --danger: #f97373;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      overflow-x: hidden;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% -12%,rgba(56,189,248,.16),transparent 34rem),
                  radial-gradient(circle at 18% 18%,rgba(234,179,8,.08),transparent 28rem),
                  linear-gradient(180deg,#020617,#020617 48%,#020617);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(15,23,42,0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1 span {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 340px;
      gap: 16px;
      padding: 16px 24px 24px;
      align-items: start;
    }
    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 300px minmax(0, 1fr);
      }
      .details {
        grid-column: 1 / -1;
        order: 3;
      }
    }
    @media (max-width: 800px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }
      .filters {
        order: 1;
      }
      .results {
        order: 2;
      }
      .details {
        order: 3;
      }
    }
    .panel {
      background: rgba(15,23,42,0.9);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 14px 14px 10px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
      /* keep panels within viewport and enable internal scrolling */
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.06) transparent;
    }

    /* Chromium scrollbar tweaks */
    .panel::-webkit-scrollbar { width: 10px; height: 10px; }
    .panel::-webkit-scrollbar-track { background: transparent; }
    .panel::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.05);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .panel::-webkit-scrollbar-thumb:hover { background: rgba(56,189,248,0.18); }
    .filters h2,
    .details h2 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .field {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field label {
      font-size: 12px;
      color: var(--muted);
    }
    input[type="text"],
    input[type="number"],
    select {
      background: #020617;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 8px 14px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      font-family: inherit;
    }
    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft);
    }
    /* Custom select arrow and spacing */
    select {
      -webkit-appearance: none;
      appearance: none;
      padding-right: 36px;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 16px) calc(50% - 3px), calc(100% - 11px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }
    /* placeholder look for select elements to match pill/muted text */
    .select-placeholder { color: var(--muted); }
    /* specific snapshot select tweaks: keep muted, padded and rounded */
    #snapshotSelect { color: var(--muted); font-size: 12px; padding: 8px 14px; border-radius: 999px; }
    /* make options and the select more consistent and padded */
    select option { font-size: 12px; padding: 8px 12px; }
    /* keep the select pill-shaped */
    select { border-radius: 999px; }
    .vocations {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .filters-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .filters-actions { display:flex; gap:8px; align-items:center; }
    .clear-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 10px; border-radius: 999px; cursor:pointer; }
    .clear-btn:hover { border-color: var(--accent); color: var(--accent); }
    .chip {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      color: var(--muted);
      background: #020617;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }
    .chip.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .chip input {
      display: none;
    }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .results-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      max-height: calc(100vh - 170px);
      overflow: auto;
      padding-right: 4px;
      padding-top: 8px; /* push results slightly down so hover effects don't clip */
    }
    .item-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 8px;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.12s ease, transform 0.08s ease, box-shadow 0.12s ease;
      min-height: 96px; /* fixed-ish size so hover highlight doesn't look uneven */
    }
    .item-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
    }
    .item-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft);
    }
    .item-sprite {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .item-sprite img {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }
    .item-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .item-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pill {
      border-radius: 999px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: #020617;
      min-width: 52px;
      text-align: center;
      display: inline-block;
    }
    .pill-accent {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* vocation pill base + colors */
    .voc-pill {
      color: var(--muted);
      border: 1px solid var(--border);
      background: transparent;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-block;
    }
    .voc-pill.knight {
      border-color: rgba(255,122,89,0.42);
      color: #ff8b6a;
      background: linear-gradient(90deg, rgba(255,122,89,0.12), rgba(255,184,107,0.06));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }
    .voc-pill.sorcerer {
      border-color: rgba(56,189,248,0.42);
      color: #7ee7ff;
      background: linear-gradient(90deg, rgba(96,165,250,0.12), rgba(56,189,248,0.06));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }
    .voc-pill.druid {
      border-color: rgba(16,185,129,0.42);
      color: #6ef2b8;
      background: linear-gradient(90deg, rgba(34,211,153,0.12), rgba(16,185,129,0.06));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }
    .voc-pill.paladin {
      border-color: rgba(245,158,11,0.42);
      color: #ffd47a;
      background: linear-gradient(90deg, rgba(246,224,94,0.12), rgba(245,158,11,0.06));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }
    .voc-pill:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,0.32); }
    .details-body {
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .details-header {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .details-header-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .details-name {
      font-size: 16px;
      font-weight: 600;
    }
    .details-sub {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .badge {
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--muted);
    }
    .badge-rare {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 6px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 6px;
    }
    .stat {
      background: #020617;
      border-radius: 999px; /* rounder, pill-like */
      border: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stat span:first-child {
      color: var(--muted);
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stat span:last-child {
      flex: 0 0 auto;
      margin-left: 6px;
      white-space: nowrap;
    }

    .drops-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }
    .drop {
      background: #020617;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 8px 12px; /* more breathing room so text doesn't touch the wall */
      display: block;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .empty {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }
    .level-range input {
      width: 96px;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 999px;
    }
    .level-range { display:flex; gap:8px; align-items:center; justify-content:center; }
    .level-sep { color: var(--muted); font-size: 14px; padding: 0 4px; }

    .stat-group {
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 6px;
      overflow: hidden;
      background: transparent;
    }
    .pill.active {
      box-shadow: 0 6px 18px rgba(0,0,0,0.32);
      transform: translateY(-1px);
    }

    .stat-group strong {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    /* Accordion styles for stat groups */
    .stat-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      padding: 8px 10px;
      background: rgba(2,6,23,0.2);
    }
    .stat-group-header:focus { outline: none; border-color: rgba(56,189,248,0.12); }
    .stat-group-header strong { margin: 0; font-size: 12px; color: var(--muted); }
    .stat-group .chev { transition: transform 0.18s ease; color: var(--muted); }
    .stat-group-content { overflow: hidden; transition: max-height 0.22s ease, padding 0.18s ease, opacity 0.12s ease; max-height: 1000px; padding: 8px; opacity:1; }
    .stat-group.collapsed .stat-group-content { max-height: 0; padding: 0 8px; opacity: 0; pointer-events: none; }
    .stat-group.collapsed .chev { transform: rotate(-90deg); }
    
    .stat-box {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      padding-left: 0px;
    }
    
    .stat-box label {
      font-size: 12px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      background: #020617;
      border-radius: 6px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    
    .stat-box input {
      transform: none;
      width: 14px;
      height: 14px;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: #020617;
      display: inline-block;
      position: relative;
    }

    .stat-box input:checked {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 6px 18px rgba(56,189,248,0.08) inset;
    }

    /* Right/details improvements */
    .details {
      position: sticky;
      top: 72px;
      align-self: start;
    }

    .filters, .results {
      align-self: start;
    }

    .details-header {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .details .item-sprite img {
      max-width: 64px;
      max-height: 64px;
      width: auto;
      height: auto;
    }

    /* Make long labels / badges wrap instead of overflow */
    .details-sub, .item-meta {
      word-break: break-word;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <img src="assets/custom/ToKlogo.gif" alt="ToKlogo" width="32" style="image-rendering: pixelated; border-radius:6px;">
      Tibidler Items
      <span>GitHub preview</span>
      <span style="color:var(--muted); margin:0 8px;">|</span>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);">
        <select id="snapshotSelect" disabled style="min-width:180px;">
          <option>Loading...</option>
        </select>
        <button id="loadSnapshotBtn" class="chip" title="Load local JSON" style="display:none;">Load</button>
      </label>
    </h1>
    <div style="font-size:12px;color:var(--muted);">
      <span id="totalCount">0</span> items ·
      <span id="visibleCount">0</span> shown
    </div>
  </header>

  <div class="layout">
    <!-- Filters -->
  <aside class="panel filters">
    <div class="filters-head">
      <h2>Filters</h2>
      <div class="filters-actions">
        <button id="clearFiltersBtn" class="clear-btn" title="Clear all filters">Clear</button>
      </div>
    </div>
    <div class="field">
      <div class="stat-box" style="grid-template-columns: 1fr;">
        <label><input type="checkbox" id="droppedFilter"> Obtainable</label>
      </div>
    </div>
  
    <!-- Search by name -->
    <div class="field">
      <label for="search">Search by name</label>
      <input id="search" type="text" placeholder="Abyss Hammer, sword, ring..." />
    </div>
  
    <!-- Search by zone -->
    <div class="field">
      <label for="zoneSearch">Search by zone / monster</label>
      <input id="zoneSearch" type="text" placeholder="lich hell, golem workshop..." />
    </div>
  
    <!-- Vocation filters -->
    <div class="field">
      <label>Required vocation</label>
      <div class="vocations" id="vocationFilters"></div>
    </div>
  
    <!-- Type filter (expandable, multiple selection) -->
    <div class="stat-group">
      <div class="stat-group-header" tabindex="0" role="button" aria-expanded="true">
        <strong>Item type</strong>
        <span class="chev" aria-hidden="true">▾</span>
      </div>
      <div class="stat-group-content">
        <div id="typeFilterContainer" class="stat-box"></div>
      </div>
    </div>
  
    <!-- Level range -->
    <div class="field">
      <label>Level required</label>
      <div class="level-range">
        <input id="minLevel" type="number" min="0" step="1" placeholder="Min" />
        <div class="level-sep">—</div>
        <input id="maxLevel" type="number" min="0" step="1" placeholder="Max" />
      </div>
      <div class="field" style="margin-top:8px;">
        <label>Damage range</label>
        <div class="level-range">
          <input id="minDamageFilter" type="number" min="0" step="1" placeholder="Min" />
          <div class="level-sep">—</div>
          <input id="maxDamageFilter" type="number" min="0" step="1" placeholder="Max" />
        </div>
      </div>
    </div>
  
    <!-- Grouped stat filters -->
    <div class="field">
      <label>Stats</label>
  
      <div class="stat-group">
        <div class="stat-group-header" tabindex="0" role="button" aria-expanded="false">
          <strong>Offensive</strong>
          <span class="chev" aria-hidden="true">▾</span>
        </div>
        <div class="stat-group-content">
          <div class="stat-box">
            <label><input type="checkbox" class="statFilter" value="attack"> attack</label>
            <!-- minDamage/maxDamage moved to Damage range inputs above -->
            <label><input type="checkbox" class="statFilter" value="sword"> sword</label>
            <label><input type="checkbox" class="statFilter" value="axe"> axe</label>
            <label><input type="checkbox" class="statFilter" value="club"> club</label>
            <label><input type="checkbox" class="statFilter" value="distance"> distance</label>
            <label><input type="checkbox" class="statFilter" value="attackModifier"> attackModifier</label>
            <label><input type="checkbox" class="statFilter" value="critChance"> critChance</label>
            <label><input type="checkbox" class="statFilter" value="critDamage"> critDamage</label>
            <label><input type="checkbox" class="statFilter" value="criticalChance"> criticalChance</label>
            <label><input type="checkbox" class="statFilter" value="criticalDamage"> criticalDamage</label>
            <label><input type="checkbox" class="statFilter" value="perfectShotDamage"> perfectShotDamage</label>
            <label><input type="checkbox" class="statFilter" value="perfectShotRange"> perfectShotRange</label>
          </div>
        </div>
      </div>
  
      <div class="stat-group">
        <div class="stat-group-header" tabindex="0" role="button" aria-expanded="false">
          <strong>Defensive</strong>
          <span class="chev" aria-hidden="true">▾</span>
        </div>
        <div class="stat-group-content">
          <div class="stat-box">
            <label><input type="checkbox" class="statFilter" value="defense"> defense</label>
            <label><input type="checkbox" class="statFilter" value="armor"> armor</label>
            <label><input type="checkbox" class="statFilter" value="shielding"> shielding</label>
            <label><input type="checkbox" class="statFilter" value="hitChance"> hitChance</label>
            <label><input type="checkbox" class="statFilter" value="hands"> hands</label>
          </div>
        </div>
      </div>
  
      <div class="stat-group">
        <div class="stat-group-header" tabindex="0" role="button" aria-expanded="false">
          <strong>Magic</strong>
          <span class="chev" aria-hidden="true">▾</span>
        </div>
        <div class="stat-group-content">
          <div class="stat-box">
            <label><input type="checkbox" class="statFilter" value="magic"> magic</label>
            <label><input type="checkbox" class="statFilter" value="holyMagic"> holyMagic</label>
            <label><input type="checkbox" class="statFilter" value="fireMagic"> fireMagic</label>
            <label><input type="checkbox" class="statFilter" value="iceMagic"> iceMagic</label>
            <label><input type="checkbox" class="statFilter" value="earthMagic"> earthMagic</label>
            <label><input type="checkbox" class="statFilter" value="energyMagic"> energyMagic</label>
            <label><input type="checkbox" class="statFilter" value="deathMagic"> deathMagic</label>
            <label><input type="checkbox" class="statFilter" value="healingMagic"> healingMagic</label>
          </div>
        </div>
      </div>
  
      <div class="stat-group">
        <div class="stat-group-header" tabindex="0" role="button" aria-expanded="false">
          <strong>Elemental Protections</strong>
          <span class="chev" aria-hidden="true">▾</span>
        </div>
        <div class="stat-group-content">
          <div class="stat-box">
            <label><input type="checkbox" class="statFilter" value="fireProtection"> fireProtection</label>
            <label><input type="checkbox" class="statFilter" value="iceProtection"> iceProtection</label>
            <label><input type="checkbox" class="statFilter" value="earthProtection"> earthProtection</label>
            <label><input type="checkbox" class="statFilter" value="energyProtection"> energyProtection</label>
            <label><input type="checkbox" class="statFilter" value="holyProtection"> holyProtection</label>
            <label><input type="checkbox" class="statFilter" value="deathProtection"> deathProtection</label>
            <label><input type="checkbox" class="statFilter" value="drownProtection"> drownProtection</label>
            <label><input type="checkbox" class="statFilter" value="manaDrainProtection"> manaDrainProtection</label>
            <label><input type="checkbox" class="statFilter" value="lifeDrainProtection"> lifeDrainProtection</label>
          </div>
        </div>
      </div>
  
      <div class="stat-group">
        <div class="stat-group-header" tabindex="0" role="button" aria-expanded="false">
          <strong>Elemental Damage</strong>
          <span class="chev" aria-hidden="true">▾</span>
        </div>
        <div class="stat-group-content">
          <div class="stat-box">
            <label><input type="checkbox" class="statFilter" value="fireDamage"> fireDamage</label>
            <label><input type="checkbox" class="statFilter" value="iceDamage"> iceDamage</label>
            <label><input type="checkbox" class="statFilter" value="earthDamage"> earthDamage</label>
            <label><input type="checkbox" class="statFilter" value="holyDamage"> holyDamage</label>
            <label><input type="checkbox" class="statFilter" value="deathDamage"> deathDamage</label>
          </div>
        </div>
      </div>
  
      <div class="stat-group">
        <div class="stat-group-header" tabindex="0" role="button" aria-expanded="false">
          <strong>Utility</strong>
          <span class="chev" aria-hidden="true">▾</span>
        </div>
        <div class="stat-group-content">
          <div class="stat-box">
            <label><input type="checkbox" class="statFilter" value="speed"> speed</label>
            <label><input type="checkbox" class="statFilter" value="range"> range</label>
            <label><input type="checkbox" class="statFilter" value="manaCost"> manaCost</label>
            <label><input type="checkbox" class="statFilter" value="manaPerShot"> manaPerShot</label>
            <label><input type="checkbox" class="statFilter" value="lifeLeech"> lifeLeech</label>
            <label><input type="checkbox" class="statFilter" value="manaLeech"> manaLeech</label>
          </div>
        </div>
      </div>
    </div>
  </aside>


    <!-- Results -->
    <section class="panel results">
      <div class="results-header">
        <span>Results</span>
        <span id="resultsInfo"></span>
      </div>
      <div class="results-list" id="results"></div>
    </section>

    <!-- Details -->
    <aside class="panel details">
      <h2>Details</h2>
      <div id="detailsContent" class="details-body">
        <p class="empty">Select an item from the list to see full details.</p>
      </div>
    </aside>
  </div>

  <script>
    const state = {
      items: [],
      filtered: [],
      selectedKey: null,
      vocations: new Set(),
      activeVocations: new Set(),
      types: new Set(),
      activeStats: new Set(),
      activeTypes: new Set()
    };
    
    const els = {
      totalCount: document.getElementById("totalCount"),
      visibleCount: document.getElementById("visibleCount"),
      results: document.getElementById("results"),
      resultsInfo: document.getElementById("resultsInfo"),
      details: document.getElementById("detailsContent"),
      search: document.getElementById("search"),
      zoneSearch: document.getElementById("zoneSearch"),
      minLevel: document.getElementById("minLevel"),
      maxLevel: document.getElementById("maxLevel"),
      minDamageFilter: document.getElementById("minDamageFilter"),
      maxDamageFilter: document.getElementById("maxDamageFilter"),
      clearFiltersBtn: document.getElementById("clearFiltersBtn"),
      droppedFilter: document.getElementById("droppedFilter"),
      snapshotSelect: document.getElementById("snapshotSelect"),
      loadSnapshotBtn: document.getElementById("loadSnapshotBtn"),
      vocationFilters: document.getElementById("vocationFilters"),
      typeFilterContainer: document.getElementById("typeFilterContainer")
    };
    
    /* ------------------------------
       VOCATION FILTERS
    ------------------------------ */
    function renderVocationFilters() {
      const container = els.vocationFilters;
      container.innerHTML = "";
      const all = Array.from(state.vocations).sort();
      if (!all.length) {
        container.innerHTML = '<span class="empty">No vocation data</span>';
        return;
      }
      all.forEach(voc => {
        const slug = voc.toLowerCase().trim().replace(/\s+/g, '-');
        const known = ['knight','sorcerer','druid','paladin'];
        const cls = known.includes(slug) ? slug : '';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pill voc-pill';
        btn.textContent = voc;
        btn.dataset.voc = voc;
        btn.tabIndex = 0;
        // reflect initial state
        const active = state.activeVocations.has(voc);
        if (active) {
          btn.classList.add('active');
          if (cls) btn.classList.add(cls);
          btn.setAttribute('aria-pressed', 'true');
        } else {
          btn.setAttribute('aria-pressed', 'false');
        }

        btn.addEventListener('click', () => {
          const isActive = btn.classList.toggle('active');
          if (isActive) {
            state.activeVocations.add(voc);
            if (cls) btn.classList.add(cls);
            btn.setAttribute('aria-pressed', 'true');
          } else {
            state.activeVocations.delete(voc);
            if (cls) btn.classList.remove(cls);
            btn.setAttribute('aria-pressed', 'false');
          }
          applyFilters();
        });

        btn.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            btn.click();
          }
        });

        container.appendChild(btn);
      });
    }
    
    /* ------------------------------
       TYPE FILTER (checkboxes)
    ------------------------------ */
    function renderTypeFilter() {
      const container = els.typeFilterContainer;
      container.innerHTML = '';
      const types = Array.from(state.types).sort();
      if (!types.length) {
        container.innerHTML = '<span class="empty">No types</span>';
        return;
      }
      types.forEach(t => {
        const label = document.createElement('label');
        label.style.cursor = 'pointer';
        label.innerHTML = `<input type="checkbox" value="${t}">${t}`;
        const input = label.querySelector('input');
        // if parent group is collapsed, keep inputs disabled until expanded
        const parentGroup = container.closest('.stat-group');
        if (parentGroup && parentGroup.classList.contains('collapsed')) input.disabled = true;
        input.addEventListener('change', () => {
          if (input.checked) state.activeTypes.add(t);
          else state.activeTypes.delete(t);
          applyFilters();
        });
        container.appendChild(label);
      });
    }
    
    /* ------------------------------
       MAIN FILTERING LOGIC
    ------------------------------ */
    function applyFilters() {
      const q = els.search.value.trim().toLowerCase();
      const zoneQ = els.zoneSearch.value.trim().toLowerCase();
      const minLevel = parseInt(els.minLevel.value || "0", 10);
      const maxLevel = parseInt(els.maxLevel.value || "0", 10);
      const activeVocs = state.activeVocations;
      const activeStats = state.activeStats;
      const dropOnly = els.droppedFilter && els.droppedFilter.checked;
    
      state.filtered = state.items.filter(item => {
        /* NAME SEARCH */
        if (q) {
          const nameMatch = item.name.toLowerCase().includes(q);
          const keyMatch = item.key.toLowerCase().includes(q);
          if (!nameMatch && !keyMatch) return false;
        }
    
        /* ZONE SEARCH */
        if (zoneQ) {
          const drops = item.droppedBy || [];
          let zoneMatch = false;
    
          for (const d of drops) {
            const monster = d.monster?.toLowerCase() || "";
            const zones = (d.zoneNames || []).map(z => z.toLowerCase());
            const zoneList = (d.zones || []).map(z => z.zone.toLowerCase());
    
            if (
              monster.includes(zoneQ) ||
              zones.some(z => z.includes(zoneQ)) ||
              zoneList.some(z => z.includes(zoneQ))
            ) {
              zoneMatch = true;
              break;
            }
          }
    
          if (!zoneMatch) return false;
        }
    
        /* LEVEL FILTERS */
        const lvl = item.levelRequired || 0;
        if (!Number.isNaN(minLevel) && minLevel > 0 && lvl < minLevel) return false;
        if (!Number.isNaN(maxLevel) && maxLevel > 0 && lvl > maxLevel) return false;
    
        /* TYPE FILTER (multiple) */
        if (state.activeTypes.size && !state.activeTypes.has(item.type)) return false;
    
        /* VOCATION FILTER */
        if (activeVocs.size) {
          const itemVocs = new Set(item.requiredVocations || []);
          let match = false;
          activeVocs.forEach(v => {
            if (itemVocs.has(v)) match = true;
          });
          if (!match) return false;
        }
    
        /* STAT FILTERS */
        if (activeStats.size) {
          const stats = item.stats || {};
          for (const stat of activeStats) {
            if (!(stat in stats)) return false;
          }
        }

        /* DAMAGE RANGE FILTER */
        const minD = parseInt(els.minDamageFilter?.value || "0", 10);
        const maxD = parseInt(els.maxDamageFilter?.value || "0", 10);
        const stats = item.stats || {};
        const itemMinD = stats.minDamage ?? stats.maxDamage ?? 0;
        const itemMaxD = stats.maxDamage ?? stats.minDamage ?? 0;
        if (!Number.isNaN(minD) && minD > 0 && itemMaxD < minD) return false;
        if (!Number.isNaN(maxD) && maxD > 0 && itemMinD > maxD) return false;
    
        /* DROPPED BY FILTER */
        if (dropOnly) {
          if (!Array.isArray(item.droppedBy) || item.droppedBy.length === 0) return false;
        }

        return true;
      });
    
      renderList();
      updateCounts();
    }
    
    /* ------------------------------
       STAT CHECKBOX HANDLING
    ------------------------------ */
    document.querySelectorAll(".statFilter").forEach(cb => {
      cb.addEventListener("change", () => {
        if (cb.checked) state.activeStats.add(cb.value);
        else state.activeStats.delete(cb.value);
        applyFilters();
      });
    });
    
    /* ------------------------------
       RENDER RESULTS LIST
    ------------------------------ */
    function renderList() {
      const container = els.results;
      
      // If list is already rendered, just update selection classes
      if (container.children.length === state.filtered.length) {
        document.querySelectorAll('.item-card').forEach(card => {
          const itemKey = card.dataset.itemKey;
          if (itemKey === state.selectedKey) {
            card.classList.add('selected');
          } else {
            card.classList.remove('selected');
          }
        });
        return;
      }
      
      // First render: build all cards
      container.innerHTML = "";
      if (!state.filtered.length) {
        container.innerHTML = '<p class="empty">No items match current filters.</p>';
        return;
      }

      state.filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = "item-card";
        card.dataset.itemKey = item.key;
        if (item.key === state.selectedKey) card.classList.add("selected");

        const sprite = document.createElement("div");
        sprite.className = "item-sprite";
        if (item.sprite) {
          const img = document.createElement("img");
          img.src = item.sprite;
          img.alt = item.name;
          sprite.appendChild(img);
        } else {
          sprite.textContent = "?";
        }

        const main = document.createElement("div");
        main.className = "item-main";

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = item.name;

        const meta = document.createElement("div");
        meta.className = "item-meta";

        const type = document.createElement("span");
        type.className = "pill";
        type.textContent = item.type || item.primaryType || "Unknown";

        const lvl = document.createElement("span");
        lvl.className = "pill";
        const levelVal = Number(item.levelRequired || 0);
        if (levelVal > 0) {
          lvl.textContent = `Lvl ${levelVal}`;
          meta.appendChild(type);
          meta.appendChild(lvl);
        } else {
          meta.appendChild(type);
        }

        if (Array.isArray(item.requiredVocations) && item.requiredVocations.length) {
          item.requiredVocations.forEach(v => {
            const vocSpan = document.createElement("span");
            const slug = v.toLowerCase().trim().replace(/\s+/g, '-');
            const known = ['knight','sorcerer','druid','paladin'];
            const cls = known.includes(slug) ? slug : '';
            vocSpan.className = cls ? `pill voc-pill ${cls}` : 'pill voc-pill';
            vocSpan.textContent = v;
            meta.appendChild(vocSpan);
          });
        }

        main.appendChild(name);
        main.appendChild(meta);

        card.appendChild(sprite);
        card.appendChild(main);

        card.addEventListener("click", () => {
          state.selectedKey = item.key;
          renderList();
          renderDetails(item);
        });

        container.appendChild(card);
      });

      els.resultsInfo.textContent = `${state.filtered.length} item(s)`;
    }
    
    /* ------------------------------
       DETAILS PANEL
    ------------------------------ */
    function renderDetails(item) {
      const c = els.details;
      if (!item) {
        c.innerHTML = '<p class="empty">Select an item to see details.</p>';
        return;
      }
    
      const vocs = Array.isArray(item.requiredVocations) && item.requiredVocations.length ? item.requiredVocations.join(", ") : null;
      const stats = item.stats || {};
      const drops = Array.isArray(item.droppedBy) ? item.droppedBy : [];
    
      c.innerHTML = "";
    
      const header = document.createElement("div");
      header.className = "details-header";
    
      const sprite = document.createElement("div");
      sprite.className = "item-sprite";
      if (item.sprite) {
        const img = document.createElement("img");
        img.src = item.sprite;
        img.alt = item.name;
        sprite.appendChild(img);
      } else {
        sprite.textContent = "?";
      }
    
      const main = document.createElement("div");
      main.className = "details-header-main";
    
      const name = document.createElement("div");
      name.className = "details-name";
      name.textContent = item.name;
    
      const sub = document.createElement("div");
      sub.className = "details-sub";
      // build badges; don't render vocation badge if there are no required vocations
      let badgesHtml = `
        <span class="badge">${item.type || item.primaryType || "Unknown type"}</span>
      `;
      if (Number(item.levelRequired || 0) > 0) {
        badgesHtml += `<span class="badge">Level ${item.levelRequired}</span>`;
      }
      if (vocs) badgesHtml += `<span class="badge">${vocs}</span>`;
      badgesHtml += `
        <span class="badge">Weight: ${item.weightOz ?? "?"} oz</span>
        <span class="badge">Value: ${item.value ?? 0} gp</span>
      `;
      sub.innerHTML = badgesHtml;
    
      main.appendChild(name);
      main.appendChild(sub);
    
      header.appendChild(sprite);
      header.appendChild(main);
    
      c.appendChild(header);
    
      if (item.description) {
        const p = document.createElement("p");
        p.style.margin = "4px 0 0";
        p.style.fontSize = "13px";
        p.textContent = item.description;
        c.appendChild(p);
      }
    
      /* STATS */
      const statsTitle = document.createElement("div");
      statsTitle.className = "section-title";
      statsTitle.textContent = "Stats";
      c.appendChild(statsTitle);
    
      const statsGrid = document.createElement("div");
      statsGrid.className = "stats-grid";
    
      const addStat = (label, value) => {
        if (value === undefined || value === null) return;
        const s = document.createElement("div");
        s.className = "stat";
        s.innerHTML = `<span>${label}</span><span>${value}</span>`;
        statsGrid.appendChild(s);
      };
    
      Object.entries(stats).forEach(([k, v]) => addStat(k, v));
    
      if (!statsGrid.children.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No stats available.";
        c.appendChild(empty);
      } else {
        c.appendChild(statsGrid);
      }
    
      /* DROPS */
      const dropsTitle = document.createElement("div");
      dropsTitle.className = "section-title";
      dropsTitle.textContent = "Dropped by";
      c.appendChild(dropsTitle);
    
      if (!drops.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No drop data.";
        c.appendChild(empty);
      } else {
        const list = document.createElement("div");
        list.className = "drops-list";
        drops.forEach(d => {
          const div = document.createElement("div");
              div.className = "drop";
                    const formatPct = (v) => {
                      const n = Number(v);
                      if (Number.isNaN(n)) return String(v);
                      return n.toFixed(4).replace(/\.?0+$/, '') + '%';
                    };
              const chance = d.chance != null ? formatPct(d.chance) : "unknown";
              const rarity = d.rarity || "unknown rarity";
          const zones = (d.zoneNames || d.zones?.map(z => z.zone) || []).join(", ");
          div.innerHTML = `
            <div><strong>${d.monster}</strong> <span style="color:var(--muted)">(${rarity}, ${chance})</span></div>
            ${zones ? `<div style="color:var(--muted)">Zones: ${zones}</div>` : ""}
          `;
          list.appendChild(div);
        });
        c.appendChild(list);
      }
    
      /* WIKI LINK */
      if (item.wikiUrl) {
        const wikiTitle = document.createElement("div");
        wikiTitle.className = "section-title";
        wikiTitle.textContent = "Wiki";
        c.appendChild(wikiTitle);
    
        const link = document.createElement("a");
        link.href = item.wikiUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open Tibia Fandom page";
        c.appendChild(link);
      }
    }
    
    /* ------------------------------
       COUNTS
    ------------------------------ */
    function updateCounts() {
      els.totalCount.textContent = state.items.length;
      els.visibleCount.textContent = state.filtered.length;
    }
    
    /* ------------------------------
       EVENT LISTENERS
    ------------------------------ */
    els.search.addEventListener("input", applyFilters);
    els.zoneSearch.addEventListener("input", applyFilters);
    els.minLevel.addEventListener("input", applyFilters);
    els.maxLevel.addEventListener("input", applyFilters);
    if (els.minDamageFilter) els.minDamageFilter.addEventListener("input", applyFilters);
    if (els.maxDamageFilter) els.maxDamageFilter.addEventListener("input", applyFilters);
    
    function setupAccordions() {
      document.querySelectorAll('.stat-group').forEach(group => {
        const header = group.querySelector('.stat-group-header');
        const content = group.querySelector('.stat-group-content');
        if (!header || !content) return;
        // respect initial aria-expanded on headers; collapse if not explicitly open
        const startOpen = header.getAttribute('aria-expanded') === 'true';
        if (!startOpen) {
          group.classList.add('collapsed');
          header.setAttribute('aria-expanded', 'false');
          content.querySelectorAll('input,select,button').forEach(el => el.disabled = true);
        } else {
          group.classList.remove('collapsed');
          header.setAttribute('aria-expanded', 'true');
          content.querySelectorAll('input,select,button').forEach(el => el.disabled = false);
        }

        header.addEventListener('click', () => {
          const closed = group.classList.toggle('collapsed');
          header.setAttribute('aria-expanded', String(!closed));
          // enable/disable inputs inside content so they aren't interactive when collapsed
          content.querySelectorAll('input,select,button').forEach(el => el.disabled = closed);
        });
        header.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            header.click();
          }
        });
      });
    }

    // Call setup immediately so UI is interactive on load
    setupAccordions();
    // wire clear button
    function clearFilters() {
      // clear text inputs
      els.search.value = '';
      els.zoneSearch.value = '';
      // clear numeric ranges
      if (els.minLevel) els.minLevel.value = '';
      if (els.maxLevel) els.maxLevel.value = '';
      if (els.minDamageFilter) els.minDamageFilter.value = '';
      if (els.maxDamageFilter) els.maxDamageFilter.value = '';
      // clear type checkboxes
      state.activeTypes.clear();
      if (els.typeFilterContainer) els.typeFilterContainer.querySelectorAll('input').forEach(i => { i.checked = false; });
      // clear vocation chips
      state.activeVocations.clear();
      const knownVocs = ['knight','sorcerer','druid','paladin'];
      document.querySelectorAll('.vocations .voc-pill').forEach(btn => {
        btn.classList.remove('active');
        btn.removeAttribute('aria-pressed');
        knownVocs.forEach(k => btn.classList.remove(k));
      });
      // clear stat filters
      state.activeStats.clear();
      document.querySelectorAll('.statFilter').forEach(cb => cb.checked = false);
      applyFilters();
    }

    if (els.clearFiltersBtn) els.clearFiltersBtn.addEventListener('click', clearFilters);
    if (els.droppedFilter) els.droppedFilter.addEventListener('change', applyFilters);

    // hidden file input for local JSON loading
    const _fileInput = document.createElement('input');
    _fileInput.type = 'file';
    _fileInput.accept = '.json,application/json';
    _fileInput.style.display = 'none';
    document.body.appendChild(_fileInput);

    _fileInput.addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      try {
        const txt = await f.text();
        const json = JSON.parse(txt);
        switchItems(json, f.name);
      } catch (err) {
        alert('Failed to load JSON file: ' + err.message);
      }
      _fileInput.value = '';
    });

    // populate snapshot dropdown by attempting to read a manifest in itemSnapshots/
    async function populateSnapshotSelect(list) {
      const sel = els.snapshotSelect;
      sel.innerHTML = '';
      if (!Array.isArray(list) || !list.length) {
        const opt = document.createElement('option');
        opt.textContent = 'No snapshots found!';
        opt.value = '';
        opt.disabled = true;
        sel.appendChild(opt);
        sel.disabled = true;
        return;
      }

      // Parse date-like prefixes from filenames (e.g. 2026-06-18.json or 20260618.json)
      const parsed = list.map(fn => {
        const name = fn;
        // try patterns YYYY-MM-DD or YYYY_MM_DD or YYYYMMDD
        const m1 = name.match(/(\d{4})[-_](\d{2})[-_](\d{2})/);
        const m2 = name.match(/(\d{4})(\d{2})(\d{2})/);
        let ts = null;
        if (m1) {
          ts = Date.parse(`${m1[1]}-${m1[2]}-${m1[3]}`);
        } else if (m2) {
          ts = Date.parse(`${m2[1]}-${m2[2]}-${m2[3]}`);
        }
        return { name, ts };
      });

      // sort: files with parsed dates first (newest->oldest), then others by name desc
      parsed.sort((a, b) => {
        if (a.ts && b.ts) return b.ts - a.ts;
        if (a.ts && !b.ts) return -1;
        if (!a.ts && b.ts) return 1;
        return b.name.localeCompare(a.name);
      });

      // when there are parsed files, just add them and auto-select the newest
      parsed.forEach(p => {
        const o = document.createElement('option');
        o.value = p.name;
        o.textContent = p.name;
        sel.appendChild(o);
      });

      sel.disabled = false;
      // keep the select text muted/consistent instead of switching styles
      sel.style.color = 'var(--muted)';

      // set change handler (use onchange to avoid multiple listeners)
      sel.onchange = async () => {
        const v = sel.value;
        if (!v) return;
        // keep select text muted even after selection
        sel.style.color = 'var(--muted)';
        await loadSnapshotFromItemSnapshots(v);
      };

      // auto-select and load the newest file (first in sorted list)
      const newest = parsed[0];
      if (newest) {
        sel.value = newest.name;
        // fire load asynchronously (don't await here during initialization)
        loadSnapshotFromItemSnapshots(newest.name);
      }
    }
    

    async function tryFetchDirectoryListing() {
      const sel = els.snapshotSelect;
      try {
        const res = await fetch('itemSnapshots/');
        if (!res.ok) throw new Error('no index');
        const ct = res.headers.get('content-type') || '';
        const text = await res.text();

        // If server returns HTML directory listing, parse anchors
        if (ct.includes('text/html') || text.includes('<a')) {
          try {
            const doc = new DOMParser().parseFromString(text, 'text/html');
            const anchors = Array.from(doc.querySelectorAll('a'));
            const files = anchors.map(a => a.getAttribute('href'))
              .filter(h => h && h.toLowerCase().endsWith('.json'))
              .map(h => {
                // strip possible leading paths
                const parts = h.split('/');
                return parts[parts.length - 1];
              });
            const unique = Array.from(new Set(files));
            if (unique.length) {
              populateSnapshotSelect(unique);
              els.loadSnapshotBtn.style.display = 'none';
              return;
            }
          } catch (e) {
            // parsing failed, fall through to fallback
          }
        }
      } catch (e) {
        // fetch failed or no listing available
      }

      // Fallback: directory listing not available — enable Load fallback
      sel.innerHTML = '';
      const opt = document.createElement('option');
      opt.textContent = 'No snapshots available';
      sel.appendChild(opt);
      sel.disabled = true;
      els.loadSnapshotBtn.style.display = '';
    }

    async function loadSnapshotFromItemSnapshots(filename) {
      try {
        const res = await fetch('itemSnapshots/' + filename);
        if (!res.ok) throw new Error('Failed to fetch ' + filename + ' (' + res.status + ')');
        const j = await res.json();
        switchItems(j, filename);
      } catch (err) {
        alert('Unable to load snapshot: ' + err.message);
      }
    }

    function switchItems(items, label) {
      if (!Array.isArray(items)) { alert('Snapshot did not contain an array of items.'); return; }
      state.items = items;
      state.filtered = items.slice();
      state.vocations.clear();
      state.types.clear();
      items.forEach(item => {
        if (Array.isArray(item.requiredVocations)) item.requiredVocations.forEach(v => state.vocations.add(v));
        if (item.type) state.types.add(item.type);
      });
      renderVocationFilters();
      // clear and re-render type checkboxes
      if (els.typeFilterContainer) els.typeFilterContainer.innerHTML = '';
      renderTypeFilter();
      renderList();
      updateCounts();
      state.selectedKey = null;
      els.details.innerHTML = '<p class="empty">Select an item from the list to see full details.</p>';
    }

    // wire load button
    if (els.loadSnapshotBtn) {
      els.loadSnapshotBtn.addEventListener('click', () => _fileInput.click());
    }

    // populate snapshot select on startup by attempting a directory listing.
    // This lets the page automatically pick up any new .json files placed into
    // `itemSnapshots/` without requiring a manifest.
    tryFetchDirectoryListing();
  </script>
</body>
</html>
